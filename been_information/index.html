<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perche — 豆在庫表</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      background: #f7f5f2;
      color: #2c2c2c;
      min-height: 100vh;
    }

    header {
      background: #2c2c2c;
      color: #f7f5f2;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; }
    header span { font-size: 13px; color: #aaa; }
    .updated { margin-left: auto; font-size: 12px; color: #888; }

    main { padding: 20px 16px; max-width: 1100px; margin: 0 auto; }

    /* ---- カードリスト（スマホ） ---- */
    .card-list { display: flex; flex-direction: column; gap: 12px; }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .bean-name { font-weight: 700; font-size: 16px; }

    .stock-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .stock-ok  { background: #e6f4ea; color: #2d7a3a; }
    .stock-low { background: #fff3e0; color: #b85c00; }
    .stock-out { background: #fdecea; color: #c0392b; }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #666;
    }

    .price-val { font-weight: 700; font-size: 15px; color: #2c2c2c; }

    .flavor-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      background: #f0ede8;
      color: #5a4e42;
      border-radius: 4px;
      padding: 3px 9px;
      font-size: 12px;
    }

    /* ---- テーブル（PC） ---- */
    .table-wrap {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: none;
    }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead tr { background: #2c2c2c; color: #f7f5f2; }
    thead th {
      padding: 14px 20px;
      text-align: left;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid #f0ede8; transition: background 0.15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #faf8f5; }
    td { padding: 16px 20px; vertical-align: middle; }
    .price { font-weight: 600; font-size: 15px; }
    .price-unit { font-size: 11px; color: #aaa; margin-left: 2px; }

    /* ---- レスポンシブ切り替え ---- */
    @media (min-width: 680px) {
      main { padding: 40px; }
      .card-list { display: none; }
      .table-wrap { display: block; }
    }

    /* ---- その他 ---- */
    .setup-banner {
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.8;
    }
    .setup-banner h2 { font-size: 15px; margin-bottom: 8px; color: #b45309; }
    .setup-banner code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
    }

    .loading { text-align: center; padding: 60px; color: #aaa; font-size: 14px; }

    .error-msg {
      background: #fdecea;
      color: #c0392b;
      border-radius: 8px;
      padding: 20px 24px;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 32px;
      font-size: 12px;
      color: #bbb;
    }
  </style>
</head>
<body>

<header>
  <h1>Perche</h1>
  <span>豆 在庫表</span>
  <div class="updated" id="updated-date"></div>
</header>

<main>
  <div id="setup-banner" class="setup-banner" style="display:none">
    <h2>⚙️ 管理者設定：Google スプレッドシートを接続してください</h2>
    以下の手順でCSV URLを取得し、このファイルの <code>SHEET_CSV_URL</code> に貼り付けてください。<br><br>
    1. Google スプレッドシートを開く<br>
    2. メニュー「ファイル → 共有 → ウェブに公開」<br>
    3. 「シート1」「カンマ区切り形式（.csv）」を選択 → 「公開」<br>
    4. 表示されたURLをコピーして、index.html の <code>SHEET_CSV_URL</code> に貼り付ける
  </div>

  <div id="content">
    <div class="loading">読み込み中...</div>
  </div>
</main>

<footer>
  &copy; Perche — 卸先専用 在庫共有ページ
</footer>

<script>
  // =====================================================
  // ▼ ここにGoogle スプレッドシートのCSV公開URLを貼る
  // =====================================================
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSzjVZE88W7PXJJq7sOOfMnxluatPEtBPJ_fjhZoHxblXjrgF1eIZ3RYEnX36ZfZEcfcikrqdgrvqHj/pub?output=csv';
  // =====================================================

  // A: 豆詳細, B: 在庫, C: 1バッチ値段, D: フレーバー(「,」区切り)
  const COL = { NAME: 0, STOCK: 1, PRICE: 2, FLAVORS: 3 };

  function stockClass(val) {
    const n = parseFloat(val);
    if (isNaN(n) || n <= 0) return 'stock-out';
    if (n <= 5) return 'stock-low';
    return 'stock-ok';
  }

  function stockLabel(val) {
    const n = parseFloat(val);
    if (isNaN(n) || n <= 0) return '在庫なし';
    return n + ' kg';
  }

  function flavorTags(val) {
    return (val || '').split(',').map(f => f.trim()).filter(Boolean)
      .map(f => `<span class="tag">${f}</span>`).join('');
  }

  function render(rows) {
    const data = rows.slice(1).filter(cols => !cols.every(c => !c.trim()));

    // カード（スマホ）
    const cards = data.map(cols => {
      const price = parseInt(cols[COL.PRICE], 10);
      const priceStr = isNaN(price) ? '-' : price.toLocaleString();
      return `
        <div class="card">
          <div class="card-header">
            <div class="bean-name">${cols[COL.NAME] || '-'}</div>
            <span class="stock-badge ${stockClass(cols[COL.STOCK])}">${stockLabel(cols[COL.STOCK])}</span>
          </div>
          <div class="card-meta">
            <span class="price-val">${priceStr}円</span>
            <span>/ 1バッチ（税込）</span>
          </div>
          <div class="flavor-tags">${flavorTags(cols[COL.FLAVORS])}</div>
        </div>`;
    }).join('');

    // テーブル（PC）
    const trows = data.map(cols => {
      const price = parseInt(cols[COL.PRICE], 10);
      const priceStr = isNaN(price) ? '-' : price.toLocaleString();
      return `
        <tr>
          <td><div class="bean-name">${cols[COL.NAME] || '-'}</div></td>
          <td><span class="stock-badge ${stockClass(cols[COL.STOCK])}">${stockLabel(cols[COL.STOCK])}</span></td>
          <td><span class="price">${priceStr}</span><span class="price-unit">円 / 1バッチ</span></td>
          <td><div class="flavor-tags">${flavorTags(cols[COL.FLAVORS])}</div></td>
        </tr>`;
    }).join('');

    return `
      <div class="card-list">${cards}</div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>豆詳細</th><th>在庫</th><th>1バッチ値段（税込）</th><th>フレーバー</th>
          </tr></thead>
          <tbody>${trows}</tbody>
        </table>
      </div>`;
  }

  function parseCSV(text) {
    return text.trim().split('\n').map(line => {
      const result = [];
      let cur = '', inQ = false;
      for (const ch of line) {
        if (ch === '"') { inQ = !inQ; }
        else if (ch === ',' && !inQ) { result.push(cur); cur = ''; }
        else { cur += ch; }
      }
      result.push(cur);
      return result;
    });
  }

  async function load() {
    const content = document.getElementById('content');
    if (!SHEET_CSV_URL) {
      document.getElementById('setup-banner').style.display = 'block';
      content.innerHTML = '';
      return;
    }
    try {
      const res = await fetch(SHEET_CSV_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const rows = parseCSV(await res.text());
      content.innerHTML = render(rows);
      document.getElementById('updated-date').textContent =
        '最終更新: ' + new Date().toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric' });
    } catch (e) {
      content.innerHTML = `<div class="error-msg">データの読み込みに失敗しました。CSV URLを確認してください。<br><small>${e.message}</small></div>`;
    }
  }

  load();
</script>

</body>
</html>
